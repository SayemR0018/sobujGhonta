<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#1b5e20" />
    </linearGradient>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="100%" stop-color="#ffb300" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="#08110b"/>
  <!-- Leaf outline -->
  <path d="M 22 78 C 22 42, 54 22, 78 22 C 78 58, 58 78, 22 78 Z" fill="url(#leafGrad)"/>
  <!-- Leaf main vein -->
  <path d="M 22 78 Q 48 52 78 22" stroke="#81c784" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Gentle side veins -->
  <path d="M 40 60 Q 36 50 44 46" stroke="#81c784" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 54 46 Q 52 36 62 34" stroke="#81c784" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Small bell icon inside for "Ghonta / Hour" -->
  <circle cx="70" cy="70" r="14" fill="#122516" stroke="#4caf50" stroke-width="2"/>
  <path d="M 66 65 C 66 62, 74 62, 74 65 L 76 72 L 64 72 Z" fill="url(#bellGrad)"/>
  <circle cx="70" cy="74" r="1.8" fill="#ffd54f"/>
</svg>
