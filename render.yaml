services:
  - type: web
    name: sobujghonta
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: LLM_PROVIDER
        value: gemma_api
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: GEMMA_API_KEY
        sync: false
      - key: TTS_PROVIDER
        value: auto
      - key: GEMINI_TTS_MODEL
        value: gemini-3.8-flash-tts
      - key: GEMINI_TTS_VOICE
        value: Kore
      - key: HF_TOKEN
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: jUjRbhZWoMK4aDciW36V
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2
